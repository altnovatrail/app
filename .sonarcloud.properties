sonar.exclusions=spec/**
# The dictionaries hold the same keys by design: ru mirrors en, and tsc holds them to each other.
# src/app/icons.ts is written by scripts/icons.ts, an entry of one shape for each icon, and
# ci-lint fails it if edited by hand.
sonar.cpd.exclusions=src/i18n/en.ts,src/i18n/ru.ts,src/app/icons.ts
