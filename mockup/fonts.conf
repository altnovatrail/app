<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The fonts of the comparison with the interface mockup (R58): the system's own configuration,
  with system-ui and sans-serif drawn by FreeSans of fonts-freefont-ttf, which the toolchain stage
  installs. The container's own choice for both, WenQuanYi Zen Hei, is a CJK font whose
  "line-height: normal" Firefox rounds a pixel taller than Chromium and WebKit at most sizes, so
  that the mockup's boxes part by up to 7 CSS px across engines; with FreeSans they agree within 2.
  The browsers of the comparison alone read this file, by FONTCONFIG_FILE: the tests of the
  screens draw by the system's own choice.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>FreeSans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>FreeSans</family></prefer>
  </alias>
</fontconfig>
